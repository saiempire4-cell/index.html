<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Task & Project Tracker</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      max-width: 600px; 
      margin: 50px auto; 
      padding: 20px; 
      background: #0f172a; 
      color: #f8fafc; 
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1 { color: #38bdf8; text-align: center; }
    .input-group { display: flex; gap: 10px; margin: 25px 0; }
    input { 
      flex: 1; 
      padding: 12px; 
      border-radius: 8px; 
      border: 1px solid #334155; 
      background: #1e293b; 
      color: #fff; 
      font-size: 16px; 
    }
    button { 
      padding: 12px 20px; 
      border-radius: 8px; 
      border: none; 
      background: #0284c7; 
      color: white; 
      cursor: pointer; 
      font-weight: bold; 
    }
    button:hover { background: #0369a1; }
    ul { list-style: none; padding: 0; }
    li { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: #1e293b; 
      padding: 12px 16px; 
      border-radius: 8px; 
      margin-bottom: 10px; 
    }
    .del-btn { background: #ef4444; padding: 6px 12px; font-size: 13px; }
    .del-btn:hover { background: #dc2626; }
  </style>
</head>
<body>
  <h1>🚀 My Project Hub</h1>
  <p style="text-align: center; color: #94a3b8;">A simple tracker built with HTML, CSS, and JavaScript.</p>
  
  <div class="input-group">
    <input type="text" id="taskInput" placeholder="Add a project milestone or task...">
    <button onclick="addTask()">Add</button>
  </div>
  
  <ul id="taskList"></ul>

  <script>
    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;
      
      const li = document.createElement('li');
      li.innerHTML = `<span>${text}</span> <button class="del-btn" onclick="this.parentElement.remove()">Done</button>`;
      document.getElementById('taskList').appendChild(li);
      input.value = '';
    }
  </script>
</body>
</html>
